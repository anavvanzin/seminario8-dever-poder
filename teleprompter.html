<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter · Ana · Seminário 8</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --text: #f0ede8;
      --amber: #f5b942;
      --green: #5bbf8a;
      --blue: #6688cc;
      --muted: #555;
      --border: #252525;
      --speech-size: 1.55rem;
    }

    body.light {
      --bg: #faf8f3;
      --text: #1a1a1a;
      --muted: #888;
      --border: #e3ddd0;
      --amber: #b5790a;
      --green: #0a7d4f;
      --blue: #2b5fb0;
    }
    body.light .speech strong { color: #000; }
    body.light .speech em { color: #444; }
    body.light .emerg { background: rgba(43,95,176,.06); border-color: #cdd8e6; }
    body.light .emerg p { color: #3a5c82; }
    body.light .emerg-label { color: #5a7494; }
    body.light .click { background: rgba(43,95,176,.06); }
    body.light .nbtn { background: #fff; border-color: #ddd2bf; color: #777; }
    body.light .nbtn:hover { background: #f0eadd; color: #222; border-color: #c9bca6; }
    body.light #counter { color: #999; }
    body.light #hint { color: #b8ad97; }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.7; }

    #progress {
      position: fixed; top: 0; left: 0;
      height: 3px; background: var(--amber);
      transition: width 0.3s ease; z-index: 100;
    }

    #wrap {
      max-width: 820px; margin: 0 auto;
      padding: 64px 48px 120px;
    }

    .badge {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--amber);
      background: rgba(245,185,66,0.09);
      border: 1px solid rgba(245,185,66,0.22);
      display: inline-block; padding: 4px 14px; border-radius: 3px;
      margin-bottom: 24px;
    }

    /* speaker chip */
    .who {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      display: inline-block; padding: 4px 12px; border-radius: 3px;
      margin: 0 0 24px 8px;
    }
    .who.ana  { color: #5bbf8a; background: rgba(91,191,138,0.12);  border: 1px solid rgba(91,191,138,0.3); }
    .who.vini { color: #6f9bff; background: rgba(111,155,255,0.12); border: 1px solid rgba(111,155,255,0.32); }
    body.light .who.ana  { color: #0a7d4f; background: rgba(10,125,79,0.08); border-color: rgba(10,125,79,0.3); }
    body.light .who.vini { color: #2b5fb0; background: rgba(43,95,176,0.08); border-color: rgba(43,95,176,0.3); }

    .title {
      font-size: 0.95rem; font-style: italic; color: var(--muted);
      margin-bottom: 40px; letter-spacing: 0.02em;
    }

    .speech { font-size: var(--speech-size, 1.55rem); line-height: 1.78; }
    .speech p { margin-bottom: 1.15em; }
    .speech strong { color: #fff; font-weight: 600; }
    .speech em { color: #bbb; }

    .click {
      font-family: 'Courier New', monospace; font-size: 0.88rem;
      color: var(--blue); background: rgba(100,130,200,0.07);
      border-left: 3px solid var(--blue);
      padding: 8px 16px; margin: 1.2em 0;
      border-radius: 0 4px 4px 0;
    }

    .passback {
      font-family: 'Courier New', monospace; font-size: 1rem;
      color: var(--green);
      border-top: 1px solid var(--border);
      margin-top: 44px; padding-top: 20px;
      letter-spacing: 0.04em;
    }
    .passback::before { content: "↩  "; }

    .emerg {
      display: none;
      border: 1px solid #2a3544;
      border-radius: 6px; padding: 20px 24px; margin-top: 32px;
      background: rgba(80,110,160,0.05);
    }
    .emerg.on { display: block; }
    .emerg-label {
      font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: #7a9ab5; margin-bottom: 14px;
    }
    .emerg p { font-size: 1.1rem; color: #8aadca; line-height: 1.65; font-style: italic; }

    #nav {
      position: fixed; bottom: 26px; right: 36px;
      display: flex; gap: 8px; align-items: center;
    }
    .nbtn {
      background: #1e1e1e; border: 1px solid #2e2e2e; color: #777;
      width: 44px; height: 44px; border-radius: 8px;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .nbtn:hover { background: #282828; color: #ccc; border-color: #555; }
    .nbtn:disabled { opacity: 0.2; cursor: default; }
    .nbtn.text { width: auto; padding: 0 14px; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; }
    #timer { width: auto; padding: 0 12px; font-family: 'Courier New', monospace; font-size: 0.85rem; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
    #timer.run { color: var(--green); border-color: var(--green); }

    #counter { font-family: 'Courier New', monospace; font-size: 0.78rem; color: #444; letter-spacing: 0.06em; min-width: 48px; text-align: center; }

    #hint { position: fixed; bottom: 30px; left: 36px; font-size: 0.68rem; color: #333; font-family: 'Courier New', monospace; letter-spacing: 0.06em; }

    @media print {
      #progress, #nav, #hint { display: none; }
      #wrap { padding: 20px; }
      body { background: white; color: #111; font-size: 13px; }
      .badge { color: #444; background: none; border-color: #888; }
      .who.ana { color: #0a7d4f; background: none; border-color: #0a7d4f; }
      .who.vini { color: #2b5fb0; background: none; border-color: #2b5fb0; }
      .passback { color: #555; }
      .emerg { display: block !important; border-color: #ccc; }
      .emerg p { color: #555; }
      .emerg-label { color: #888; }
      .speech { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

<div id="wrap"></div>

  <button class="nbtn" id="bn" title="Próximo (→ / Espaço)">→</button>

      Certas decisões podem ser automatizadas. Mas a <em>comunicação</em> de uma decisão adversa a alguém em situação de vulnerabilidade deveria ser feita por <strong>uma pessoa, não por uma máquina.</strong></p>
      <p>A negativa de uma aposentadoria não deveria chegar como frase fria num aplicativo.<br>
      <strong>A dignidade do administrado também está em como ele é avisado.</strong></p>
      <p>"Dois pressupostos do contraditório: a pessoa precisa compreender — e precisa ser tratada como pessoa."</p>
    `,
    passBack: "E agora a gente mostra como isso vira ferramenta.",
    emerg: "Dois pressupostos antes do contraditório. Literacia: não se contesta o que não se compreende. Notícia humana: decisão adversa a pessoa vulnerável não deveria chegar como frase fria — a pessoa precisa entender e ser tratada como pessoa."
  },
  {
    slide: "31–33", speaker: "Ana", title: "Demo · Conselho de Contestação Algorítmica",
    speech: `
      <p>"Construímos um protótipo: <strong>Conselho de Contestação Algorítmica.</strong>"</p>
      <p>A trabalhadora rural com aposentadoria negada. Em vez de uma negativa padronizada — <strong>quatro perspectivas:</strong></p>
      <p>→ <strong>Defensoria Pública:</strong> contraditório prévio, art. 5º LV, IN 128/2022 descumprida.<br>
      → <strong>Cientista de Dados:</strong> viés de proxy — lacuna contributiva em CNIS de trabalhador rural é a norma, não exceção.<br>
      → <strong>Administrador Público:</strong> Lei 14.129 art. 6º, falta supervisão humana, art. 20 §2º LGPD.<br>
      → <strong>Cidadão:</strong> exclusão digital, literacia, notícia humana — ninguém ligou, chegou por app.</p>
      <p><strong>Fase 1:</strong> pareceres independentes. <strong>Fase 2:</strong> se avaliam — tensões ficam visíveis. <strong>Fase 3:</strong> relator sintetiza.</p>
      <p><strong>O sistema não decide pela pessoa. Ele devolve a ela o contraditório que o Estado suprimiu.</strong></p>
    `,
    clicks: [
      "→ Clique: INSS — Aposentadoria Rural Negada",
      "→ Navegue: Fase 1 → Fase 2 → Fase 3",
      "→ Se travar: vai pro Conselho.html (Plano B offline)"
    ],
    passBack: "Vinícius, o fecho.",
    emerg: "O Conselho não substitui a Administração. Organiza quatro perspectivas: defesa, dados, governança, cidadão. A função é devolver contraditório onde havia só negativa automática."
  },
  {
    slide: "33–34", speaker: "Ana", title: "Fecho (parte da Ana)",
    speech: `
      <p>O protótipo é a resposta prática à pergunta do início.</p>
      <p><strong>A Administração 4.0 não fica democrática só por ser digital.</strong></p>
      <p>Ela só é legítima quando a decisão pode ser <strong>compreendida, explicada e contestada</strong> — e isso vale com mais força justamente porque o Estado é, ao mesmo tempo, quem faz a regra e quem mais tende a relativizá-la.</p>
      <p><strong>Se o Estado quer decidir por dados, ele precisa aceitar também ser controlado por direitos.</strong></p>
    `,
    passBack: "Vinícius fecha com a releitura constitucional.",
    emerg: "Administração 4.0 não é democrática por ser digital. Só é legítima quando a decisão pode ser compreendida, explicada e contestada. Se o Estado quer decidir por dados, precisa aceitar ser controlado por direitos."
  },
  {
    slide: "33–34", speaker: "Vinícius", title: "Fecho constitucional + pergunta final",
    speech: `
      <p>"A gente fecha com uma releitura constitucional dos institutos que atravessaram os quatro artigos."</p>
      <p>"<strong>Privacidade</strong> — no digital, não é só ser deixado em paz: é saber quais dados o Estado tem sobre você e exigir correção. Art. 5º, LXXIX. Mas direito fundamental sem enforcement é promessa."</p>
      <p>"<strong>Publicidade</strong> — não se esgota em portal: é publicar em formato aberto, compreensível, e não usar o sigilo como escudo. Art. 37, caput."</p>
      <p>"<strong>Contraditório</strong> — na decisão automatizada, precisa ser prévio. Art. 5º, LV: escrito para qualquer mundo em que o Estado decida e o cidadão sofra."</p>
      <p>"<strong>Motivação</strong> — não pode ser fórmula padronizada. 'Inconsistência de dados' não é motivação, é placeholder. Lei 9.784/99, art. 50, exige motivação clara e congruente."</p>
      <p>"A Administração Pública digital está decidindo <strong>melhor</strong> — ou apenas <strong>mais rápido</strong>, com menos compreensão, contestação e participação? Fica a pergunta. Obrigado."</p>
    `,
    passBack: null, emerg: null

  {

      <p><em>"Velocidade não é eficiência quando a negativa é ilegítima. Decidir rápido um indeferimento indevido é dano administrativamente acelerado."</em></p>

let cur = 0, emergOn = false;
const wrap = document.getElementById('wrap');
const bp = document.getElementById('bp');
const bn = document.getElementById('bn');
const be = document.getElementById('be');

function render() {
  const c = CARDS[cur];
  document.getElementById('progress').style.width = (cur / (CARDS.length - 1) * 100) + '%';
  document.getElementById('counter').textContent = `${cur + 1} / ${CARDS.length}`;

  const who = c.speaker === 'Ana' ? 'ana' : 'vini';
  let h = `<div class="badge">SLIDE ${c.slide}</div><span class="who ${who}">${c.speaker}</span><div class="title">${c.title}</div><div class="speech">${c.speech}`;
  if (c.clicks) c.clicks.forEach(cl => h += `<div class="click">${cl}</div>`);
  h += '</div>';
  if (c.passBack) h += `<div class="passback">${c.passBack}</div>`;
  if (c.emerg) h += `<div class="emerg${emergOn ? ' on' : ''}"><div class="emerg-label">▼ versão de emergência</div><p>${c.emerg}</p></div>`;

  wrap.innerHTML = h;
  bp.disabled = cur === 0;
  bn.disabled = cur === CARDS.length - 1;
  window.scrollTo(0, 0);
}

function next() { if (cur < CARDS.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }
function toggleE() { emergOn = !emergOn; render(); }

bn.onclick = next; bp.onclick = prev; be.onclick = toggleE;

// ── font size (persisted) ──
let fontPx = parseFloat(localStorage.getItem('tp-font')) || 1.55;
function applyFont() {
  fontPx = Math.min(2.6, Math.max(1.0, fontPx));
  document.documentElement.style.setProperty('--speech-size', fontPx.toFixed(2) + 'rem');
  localStorage.setItem('tp-font', fontPx);
}
function bigger() { fontPx += 0.12; applyFont(); }
function smaller() { fontPx -= 0.12; applyFont(); }
document.getElementById('bplus').onclick = bigger;
document.getElementById('bminus').onclick = smaller;
applyFont();

// ── theme (persisted) ──
const btheme = document.getElementById('btheme');
function applyTheme() {
  const light = localStorage.getItem('tp-theme') === 'light';
  document.body.classList.toggle('light', light);
  btheme.textContent = light ? '☀' : '☾';
}
function toggleTheme() {
  localStorage.setItem('tp-theme', localStorage.getItem('tp-theme') === 'light' ? 'dark' : 'light');
  applyTheme();
}
btheme.onclick = toggleTheme;
applyTheme();

// ── pacing timer ──
const timerEl = document.getElementById('timer');
let tSec = 0, tInt = null;
function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function tick() { tSec++; timerEl.textContent = fmt(tSec); }
function toggleTimer() {
  if (tInt) { clearInterval(tInt); tInt = null; timerEl.classList.remove('run'); }
  else { tInt = setInterval(tick, 1000); timerEl.classList.add('run'); }
}
function resetTimer() { clearInterval(tInt); tInt = null; tSec = 0; timerEl.classList.remove('run'); timerEl.textContent = '0:00'; }
timerEl.onclick = toggleTimer;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'e' || e.key === 'E') toggleE();
  else if (e.key === 'p' || e.key === 'P') window.print();
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); bigger(); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); smaller(); }
  else if (e.key === 'l' || e.key === 'L') toggleTheme();
  else if (e.key === 't' || e.key === 'T') toggleTimer();
  else if (e.key === '0') resetTimer();
});

let tx = 0;
document.addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive: true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
}, {passive: true});

render();

// ── auto-fade the hint so it never clutters long cards ──
const hintEl = document.getElementById('hint');
hintEl.style.transition = 'opacity .8s';
let hintT;
function flashHint() {
  hintEl.style.opacity = '1';
  clearTimeout(hintT);
  hintT = setTimeout(() => { hintEl.style.opacity = '0'; }, 5000);
}
flashHint();
document.addEventListener('keydown', flashHint);
document.addEventListener('click', flashHint);
</script>
</body>
