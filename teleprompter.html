<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter · Ana · Seminário 8</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --text: #f0ede8;
      --amber: #f5b942;
      --green: #5bbf8a;
      --blue: #6688cc;
      --muted: #555;
      --border: #252525;
      --speech-size: 1.55rem;
    }

    body.light {
      --bg: #faf8f3;
      --text: #1a1a1a;
      --muted: #888;
      --border: #e3ddd0;
      --amber: #b5790a;
      --green: #0a7d4f;
      --blue: #2b5fb0;
    }
    body.light .speech strong { color: #000; }
    body.light .speech em { color: #444; }
    body.light .emerg { background: rgba(43,95,176,.06); border-color: #cdd8e6; }
    body.light .emerg p { color: #3a5c82; }
    body.light .emerg-label { color: #5a7494; }
    body.light .click { background: rgba(43,95,176,.06); }
    body.light .nbtn { background: #fff; border-color: #ddd2bf; color: #777; }
    body.light .nbtn:hover { background: #f0eadd; color: #222; border-color: #c9bca6; }
    body.light #counter { color: #999; }
    body.light #hint { color: #b8ad97; }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.7; }

    #progress {
      position: fixed; top: 0; left: 0;
      height: 3px; background: var(--amber);
      transition: width 0.3s ease; z-index: 100;
    }

    #wrap {
      max-width: 820px; margin: 0 auto;
      padding: 64px 48px 120px;
    }

    .badge {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--amber);
      background: rgba(245,185,66,0.09);
      border: 1px solid rgba(245,185,66,0.22);
      display: inline-block; padding: 4px 14px; border-radius: 3px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 0.95rem; font-style: italic; color: var(--muted);
      margin-bottom: 40px; letter-spacing: 0.02em;
    }

    .speech { font-size: var(--speech-size, 1.55rem); line-height: 1.78; }
    .speech p { margin-bottom: 1.15em; }
    .speech strong { color: #fff; font-weight: 600; }
    .speech em { color: #bbb; }

    .click {
      font-family: 'Courier New', monospace; font-size: 0.88rem;
      color: var(--blue); background: rgba(100,130,200,0.07);
      border-left: 3px solid var(--blue);
      padding: 8px 16px; margin: 1.2em 0;
      border-radius: 0 4px 4px 0;
    }

    .passback {
      font-family: 'Courier New', monospace; font-size: 1rem;
      color: var(--green);
      border-top: 1px solid var(--border);
      margin-top: 44px; padding-top: 20px;
      letter-spacing: 0.04em;
    }
    .passback::before { content: "↩  "; }

    .emerg {
      display: none;
      border: 1px solid #2a3544;
      border-radius: 6px; padding: 20px 24px; margin-top: 32px;
      background: rgba(80,110,160,0.05);
    }
    .emerg.on { display: block; }
    .emerg-label {
      font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: #7a9ab5; margin-bottom: 14px;
    }
    .emerg p { font-size: 1.1rem; color: #8aadca; line-height: 1.65; font-style: italic; }

    #nav {
      position: fixed; bottom: 26px; right: 36px;
      display: flex; gap: 8px; align-items: center;
    }
    .nbtn {
      background: #1e1e1e; border: 1px solid #2e2e2e; color: #777;
      width: 44px; height: 44px; border-radius: 8px;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .nbtn:hover { background: #282828; color: #ccc; border-color: #555; }
    .nbtn:disabled { opacity: 0.2; cursor: default; }
    .nbtn.text { width: auto; padding: 0 14px; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; }
    #timer { width: auto; padding: 0 12px; font-family: 'Courier New', monospace; font-size: 0.85rem; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
    #timer.run { color: var(--green); border-color: var(--green); }

    #counter { font-family: 'Courier New', monospace; font-size: 0.78rem; color: #444; letter-spacing: 0.06em; min-width: 48px; text-align: center; }

    #hint { position: fixed; bottom: 30px; left: 36px; font-size: 0.68rem; color: #333; font-family: 'Courier New', monospace; letter-spacing: 0.06em; }

    @media print {
      #progress, #nav, #hint { display: none; }
      #wrap { padding: 20px; }
      body { background: white; color: #111; font-size: 13px; }
      .badge { color: #444; background: none; border-color: #888; }
      .passback { color: #555; }
      .emerg { display: block !important; border-color: #ccc; }
      .emerg p { color: #555; }
      .emerg-label { color: #888; }
      .speech { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

<div id="progress"></div>
<div id="wrap"></div>

<div id="nav">
  <button class="nbtn" id="timer" title="Cronômetro (T inicia/pausa · 0 zera)">0:00</button>
  <button class="nbtn" id="bminus" title="Fonte menor (−)">A−</button>
  <button class="nbtn" id="bplus" title="Fonte maior (+)">A+</button>
  <button class="nbtn" id="btheme" title="Claro/escuro (L)">☾</button>
  <div id="counter"></div>
  <button class="nbtn" id="bp" title="Anterior (←)">←</button>
  <button class="nbtn text" id="be" title="Emergência (E)">emerg</button>
  <button class="nbtn" id="bn" title="Próximo (→ / Espaço)">→</button>
</div>

<div id="hint">← → espaço · E emergência · A± fonte · L claro/escuro · T cronômetro · P imprimir</div>

let cur = 0, emergOn = false;
const wrap = document.getElementById('wrap');
const bp = document.getElementById('bp');
const bn = document.getElementById('bn');
const be = document.getElementById('be');

function render() {
  const c = CARDS[cur];
  document.getElementById('progress').style.width = (cur / (CARDS.length - 1) * 100) + '%';
  document.getElementById('counter').textContent = `${cur + 1} / ${CARDS.length}`;

  let h = `<div class="badge">SLIDE ${c.slide}</div><div class="title">${c.title}</div><div class="speech">${c.speech}`;
  if (c.clicks) c.clicks.forEach(cl => h += `<div class="click">${cl}</div>`);
  h += '</div>';
  if (c.passBack) h += `<div class="passback">${c.passBack}</div>`;
  if (c.emerg) h += `<div class="emerg${emergOn ? ' on' : ''}"><div class="emerg-label">▼ versão de emergência</div><p>${c.emerg}</p></div>`;

  wrap.innerHTML = h;
  bp.disabled = cur === 0;
  bn.disabled = cur === CARDS.length - 1;
  window.scrollTo(0, 0);
}

function next() { if (cur < CARDS.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }
function toggleE() { emergOn = !emergOn; render(); }

bn.onclick = next; bp.onclick = prev; be.onclick = toggleE;

// ── font size (persisted) ──
let fontPx = parseFloat(localStorage.getItem('tp-font')) || 1.55;
function applyFont() {
  fontPx = Math.min(2.6, Math.max(1.0, fontPx));
  document.documentElement.style.setProperty('--speech-size', fontPx.toFixed(2) + 'rem');
  localStorage.setItem('tp-font', fontPx);
}
function bigger() { fontPx += 0.12; applyFont(); }
function smaller() { fontPx -= 0.12; applyFont(); }
document.getElementById('bplus').onclick = bigger;
document.getElementById('bminus').onclick = smaller;
applyFont();

// ── theme (persisted) ──
const btheme = document.getElementById('btheme');
function applyTheme() {
  const light = localStorage.getItem('tp-theme') === 'light';
  document.body.classList.toggle('light', light);
  btheme.textContent = light ? '☀' : '☾';
}
function toggleTheme() {
  localStorage.setItem('tp-theme', localStorage.getItem('tp-theme') === 'light' ? 'dark' : 'light');
  applyTheme();
}
btheme.onclick = toggleTheme;
applyTheme();

// ── pacing timer ──
const timerEl = document.getElementById('timer');
let tSec = 0, tInt = null;
function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function tick() { tSec++; timerEl.textContent = fmt(tSec); }
function toggleTimer() {
  if (tInt) { clearInterval(tInt); tInt = null; timerEl.classList.remove('run'); }
  else { tInt = setInterval(tick, 1000); timerEl.classList.add('run'); }
}
function resetTimer() { clearInterval(tInt); tInt = null; tSec = 0; timerEl.classList.remove('run'); timerEl.textContent = '0:00'; }
timerEl.onclick = toggleTimer;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'e' || e.key === 'E') toggleE();
  else if (e.key === 'p' || e.key === 'P') window.print();
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); bigger(); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); smaller(); }
  else if (e.key === 'l' || e.key === 'L') toggleTheme();
  else if (e.key === 't' || e.key === 'T') toggleTimer();
  else if (e.key === '0') resetTimer();
});

let tx = 0;
document.addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive: true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
}, {passive: true});

render();

// ── auto-fade the hint so it never clutters long cards ──
const hintEl = document.getElementById('hint');
hintEl.style.transition = 'opacity .8s';
let hintT;
function flashHint() {
  hintEl.style.opacity = '1';
  clearTimeout(hintT);
  hintT = setTimeout(() => { hintEl.style.opacity = '0'; }, 5000);
}
flashHint();
document.addEventListener('keydown', flashHint);
document.addEventListener('click', flashHint);
</script>
</body>
</html>
